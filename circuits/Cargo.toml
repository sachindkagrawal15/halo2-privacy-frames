[workspace]
resolver = "2"
members = ["ghost-circuit", "ghost-cli", "ghost-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ghost-circuit = { path = "ghost-circuit" }
halo2-base = { version = "=0.5.6", default-features = false }
snark-verifier = { version = "=0.2.8", default-features = false, features = ["loader_evm"] }
snark-verifier-sdk = { version = "=0.2.8", default-features = false, features = ["loader_evm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
num-bigint = "0.4"
rand = "0.8"

# halo2-base 0.5.6 with one change: halo2-axiom's `multicore` is an opt-in feature instead of always on,
# because halo2-axiom refuses to build it for wasm32 without atomics. See vendor/halo2-base/VENDORED.md.
[patch.crates-io]
halo2-base = { path = "vendor/halo2-base" }

# Proving is unusably slow without optimizations, even while iterating.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
