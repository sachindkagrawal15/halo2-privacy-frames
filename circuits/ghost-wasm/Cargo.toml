[package]
name = "ghost-wasm"
description = "In-browser Halo2 Privacy Frames prover (wasm-bindgen)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ghost-circuit.workspace = true
halo2-base.workspace = true
snark-verifier-sdk.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# rand -> getrandom 0.2 needs the "js" backend to get entropy from crypto.getRandomValues
getrandom = { version = "0.2", features = ["js"] }
