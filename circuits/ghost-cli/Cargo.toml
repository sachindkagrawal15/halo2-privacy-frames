[package]
name = "ghost-cli"
description = "Keygen, EVM verifier generation and native proving for Halo2 Privacy Frames"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ghost-circuit.workspace = true
# native: prove on every core
halo2-base = { workspace = true, features = ["multicore"] }
snark-verifier = { workspace = true, features = ["revm"] }
# loader_halo2 provides CircuitExt for BaseCircuitBuilder, which the verifier generator needs
snark-verifier-sdk = { workspace = true, features = ["revm", "loader_halo2"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
